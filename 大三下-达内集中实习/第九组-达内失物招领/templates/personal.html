{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>个人中心</h2>
    
    <!-- 信息修改表单 -->
    <form method="POST" class="mt-4">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ user_now.username }}" required>
        </div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ user_now.email }}" required>
        </div>
        <div class="form-group">
            <label for="new_password">新密码（不填则不修改）</label>
            <input type="password" class="form-control" id="new_password" name="new_password" placeholder="请输入新密码">
        </div>
        <button type="submit" class="btn btn-primary">保存修改</button>
    </form>
</div>

{% if user_now %}
    <div class="user-info">
        <h3>基本信息</h3>
        <p><strong>用户名:</strong> {{ user_now.username }}</p>
        <p><strong>姓名:</strong> {{ user_now.name }}</p>
        {% if user_now.is_admin %}
            <div class="admin-section">
                <h3>管理员功能</h3>
                <p><a href="/user_management" class="btn btn-warning">用户管理</a></p>
                <p><a href="/ai_assistant" class="btn btn-info">自然语言配置助手</a></p>
            </div>
        {% else %}
            <div class="permission-alert alert alert-warning">
                <p>您不具备企业权限，请联系管理员开通！</p>
            </div>
        {% endif %}
    </div>
{% else %}
    <div class="alert alert-info">
        <p>请先<a href="/login">登录</a>以查看个人信息</p>
    </div>
{% endif %}
{% endblock %}
